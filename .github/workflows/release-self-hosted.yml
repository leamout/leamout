name: Signed self-hosted releases

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release-self-hosted.yml"
      - "server/**"
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: self-hosted-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test license verification and build issuer tooling
        working-directory: server
        run: |
          go test ./internal/commercial/licensing
          go build -o /tmp/leamout-license ./cmd/license
          if /tmp/leamout-license -check-keyring -public-keys ''; then
            echo "Empty release keyrings must be rejected."
            exit 1
          fi

  publish:
    name: Publish and sign ${{ matrix.target }}
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: self-hosted-release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - runtime
          - migrate
    env:
      LICENSE_PUBLIC_KEYS: ${{ vars.LICENSE_PUBLIC_KEYS }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      IMAGE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Verify release source and image names
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo "Release tag must be a Docker-compatible version such as v1.0.0."
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "RELEASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-self-hosted/$IMAGE_TARGET" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Validate issuer public keys
        working-directory: server
        run: go run ./cmd/license -check-keyring -public-keys "$LICENSE_PUBLIC_KEYS"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.RELEASE_IMAGE }}:${{ env.RELEASE_TAG }}
          build-args: |
            LICENSE_PUBLIC_KEYS=${{ env.LICENSE_PUBLIC_KEYS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.1.3
      - name: Sign and verify the published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-self-hosted.yml@refs/tags/$RELEASE_TAG"
          image="$RELEASE_IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          printf '%s\n' "$image" > "self-hosted-$IMAGE_TARGET.digest.txt"
          {
            echo "### Verified self-hosted $IMAGE_TARGET image"
            echo
            echo "Digest: \`$image\`"
            echo
            echo "Certificate identity: \`$identity\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified image digest
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-${{ matrix.target }}-${{ github.event.release.tag_name }}
          path: self-hosted-${{ matrix.target }}.digest.txt
          if-no-files-found: error
