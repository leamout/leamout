name: Docker

on:
  pull_request:
    paths:
      - "deploy/**"
      - "scripts/**"
      - "server/**"
      - "clients/**"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/**"
      - "scripts/**"
      - "server/**"
      - "clients/**"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  drain-scripts:
    name: Validate deployment scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: |
          sh -n scripts/certs/generate-self-signed.sh
          sh -n scripts/certs/check-certs.sh
          sh -n scripts/certs/install-system-ca.sh
          sh -n scripts/certs/provision-letsencrypt.sh
          sh -n scripts/certs/renew-letsencrypt.sh
          sh -n scripts/certs/certbot-deploy-hook.sh
          sh -n scripts/certs/install-certbot-renewal.sh
          sh -n deploy/drain.sh
          sh -n deploy/resume.sh
          sh -n deploy/opensips/apply-drain-config.sh
          sh -n deploy/opensips/drain-control.sh
          sh -n deploy/freeswitch/drain-control.sh

      - name: Exercise certificate helpers
        run: |
          CERT_DIR=/tmp/leamout-certs CERT_DAYS=1 sh scripts/certs/generate-self-signed.sh
          CERT_DIR=/tmp/leamout-certs sh scripts/certs/check-certs.sh

          if CERT_DIR=/tmp/leamout-certs sh scripts/certs/generate-self-signed.sh; then
            echo "certificate generator unexpectedly overwrote existing files" >&2
            exit 1
          fi

          CERT_DIR=/tmp/leamout-production-certs sh scripts/certs/install-system-ca.sh
          test -s /tmp/leamout-production-certs/carrier-ca.pem

          mkdir -p /tmp/leamout-lineage
          cp /tmp/leamout-certs/fullchain.pem /tmp/leamout-lineage/fullchain.pem
          cp /tmp/leamout-certs/privkey.pem /tmp/leamout-lineage/privkey.pem
          cp /tmp/leamout-production-certs/carrier-ca.pem /tmp/leamout-hook-certs-carrier-ca.pem
          mkdir -p /tmp/leamout-hook-certs
          cp /tmp/leamout-hook-certs-carrier-ca.pem /tmp/leamout-hook-certs/carrier-ca.pem

          RENEWED_LINEAGE=/tmp/leamout-lineage \
          RENEWED_DOMAINS=sip.example.com \
          TLS_DOMAIN=sip.example.com \
          CERT_DIR=/tmp/leamout-hook-certs \
          RESTART_OPENSIPS=0 \
          sh scripts/certs/certbot-deploy-hook.sh

          CERT_DIR=/tmp/leamout-hook-certs sh scripts/certs/check-certs.sh

      - name: Verify OpenSIPS drain route placement
        run: |
          cp deploy/opensips/opensips.cfg /tmp/opensips.cfg
          sh deploy/opensips/apply-drain-config.sh /tmp/opensips.cfg

          options_line="$(grep -n 'if (is_method("OPTIONS")' /tmp/opensips.cfg | head -n1 | cut -d: -f1)"
          drain_line="$(grep -n 'route(LEAMOUT_DRAIN);' /tmp/opensips.cfg | head -n1 | cut -d: -f1)"
          register_line="$(grep -n '# REGISTER is authenticated' /tmp/opensips.cfg | head -n1 | cut -d: -f1)"

          test "$options_line" -lt "$drain_line"
          test "$drain_line" -lt "$register_line"

      - name: Build FreeSWITCH image for drain helper check
        run: |
          docker build \
            --file deploy/freeswitch/Dockerfile \
            --tag leamout/freeswitch:test \
            deploy/freeswitch

      - name: Exercise FreeSWITCH drain helper
        run: |
          docker run -d \
            --name freeswitch-drain-test \
            -e FREESWITCH_ESL_PASSWORD=test-password \
            leamout/freeswitch:test

          cleanup() {
            docker rm -f freeswitch-drain-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if docker exec freeswitch-drain-test \
              fs_cli -H 127.0.0.1 -P 8021 -p test-password -x status >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs freeswitch-drain-test >&2 || true
            exit 1
          fi

          drain=(docker exec freeswitch-drain-test /usr/local/bin/leamout-freeswitch-drain)
          test "$("${drain[@]}" status)" = accepting
          test "$("${drain[@]}" enable)" = draining
          test "$("${drain[@]}" status)" = draining
          "${drain[@]}" channels | grep -Eq '^[0-9]+$'
          test "$("${drain[@]}" resume)" = accepting
          test "$("${drain[@]}" status)" = accepting

  stack:
    name: Build and start deployment stack
    runs-on: ubuntu-latest
    env:
      CARRIER_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate CI TLS certificates
        run: CERT_DAYS=1 make certs

      - name: Validate CI TLS certificates
        run: make check-certs

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

      - name: Validate migration checksums and SQL
        run: |
          docker run --rm \
            -v "${PWD}/server/migrations:/migrations:ro" \
            arigaio/atlas:1.3.0-alpine \
            migrate validate --dir file:///migrations

      - name: Create CI Compose override
        run: |
          cat > /tmp/compose.ci.yaml <<'YAML'
          services:
            rtpengine:
              ports: !reset []
            coturn:
              ports: !reset []
          YAML

      - name: Build production images
        run: |
          for service in server worker web console waitlist opensips freeswitch rtpengine; do
            echo "::group::Build ${service}"
            docker compose \
              --env-file .env.example \
              -f deploy/compose.yaml \
              -f /tmp/compose.ci.yaml \
              build "${service}"
            echo "::endgroup::"
          done

      - name: Start deployment stack
        run: |
          docker compose \
            --env-file .env.example \
            -f deploy/compose.yaml \
            -f /tmp/compose.ci.yaml \
            up -d

      - name: Verify deployment stack
        run: |
          compose="docker compose --env-file .env.example -f deploy/compose.yaml -f /tmp/compose.ci.yaml"

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          $compose ps -a
          test "$ready" -eq 1

          for service in server worker web console waitlist opensips coturn freeswitch rtpengine postgres redis nats; do
            container_id="$($compose ps -q "$service")"
            test -n "$container_id"
            test "$(docker inspect -f '{{.State.Running}}' "$container_id")" = true
          done

          migrate_id="$($compose ps -aq migrate)"
          test -n "$migrate_id"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$migrate_id")" -eq 0

      - name: Dump deployment logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file .env.example \
            -f deploy/compose.yaml \
            -f /tmp/compose.ci.yaml \
            ps -a || true
          docker compose \
            --env-file .env.example \
            -f deploy/compose.yaml \
            -f /tmp/compose.ci.yaml \
            logs --no-color --tail=300 || true

      - name: Stop deployment stack
        if: always()
        run: |
          docker compose \
            --env-file .env.example \
            -f deploy/compose.yaml \
            -f /tmp/compose.ci.yaml \
            down -v --remove-orphans || true
