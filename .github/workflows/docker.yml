name: Docker

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  drain-scripts:
    name: Validate drain controls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: |
          sh -n deploy/drain.sh
          sh -n deploy/resume.sh
          sh -n deploy/opensips/apply-drain-config.sh
          sh -n deploy/opensips/drain-control.sh
          sh -n deploy/freeswitch/drain-control.sh

      - name: Verify OpenSIPS drain route placement
        run: |
          cp deploy/opensips/opensips.cfg /tmp/opensips.cfg
          sh deploy/opensips/apply-drain-config.sh /tmp/opensips.cfg

          options_line="$(grep -n 'if (is_method("OPTIONS")' /tmp/opensips.cfg | head -n1 | cut -d: -f1)"
          drain_line="$(grep -n 'route(LEAMOUT_DRAIN);' /tmp/opensips.cfg | head -n1 | cut -d: -f1)"
          register_line="$(grep -n '# REGISTER is authenticated' /tmp/opensips.cfg | head -n1 | cut -d: -f1)"

          test "$options_line" -lt "$drain_line"
          test "$drain_line" -lt "$register_line"

      - name: Validate Compose configuration
        env:
          CARRIER_CREDENTIAL_ENCRYPTION_KEY: test-key
          FREESWITCH_ESL_PASSWORD: test-password
          RTPENGINE_PUBLIC_IP: 127.0.0.1
          TURN_AUTH_SECRET: test-turn-secret
          TURN_EXTERNAL_IP: 127.0.0.1
          TURN_PUBLIC_URLS: turn:127.0.0.1:3478
          TURN_REALM: example.test
        run: docker compose -f deploy/compose.yaml config >/dev/null

  opensips:
    name: Build OpenSIPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build OpenSIPS image
        run: |
          docker build \
            --file deploy/opensips/Dockerfile \
            --build-arg OPENSIPS_VERSION=4.0.1 \
            --tag leamout/opensips:test \
            deploy/opensips

  freeswitch:
    name: Build FreeSWITCH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build FreeSWITCH image
        run: |
          docker build \
            --file deploy/freeswitch/Dockerfile \
            --tag leamout/freeswitch:test \
            deploy/freeswitch

      - name: Exercise FreeSWITCH drain helper
        run: |
          docker run -d \
            --name freeswitch-drain-test \
            -e FREESWITCH_ESL_PASSWORD=test-password \
            leamout/freeswitch:test

          cleanup() {
            docker rm -f freeswitch-drain-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          dump_freeswitch_diagnostics() {
            echo "--- raw fsctl pause_check ---" >&2
            docker exec freeswitch-drain-test \
              fs_cli -H 127.0.0.1 -P 8021 -p test-password \
              -x 'fsctl pause_check' >&2 || true
            echo "--- raw show channels count ---" >&2
            docker exec freeswitch-drain-test \
              fs_cli -H 127.0.0.1 -P 8021 -p test-password \
              -x 'show channels count' >&2 || true
          }

          assert_eq() {
            expected="$1"
            shift

            if actual="$("$@")"; then
              :
            else
              rc=$?
              echo "::error::command failed with exit $rc: $*" >&2
              dump_freeswitch_diagnostics
              return "$rc"
            fi

            if [ "$actual" != "$expected" ]; then
              echo "::error::expected '$expected', got '$actual': $*" >&2
              dump_freeswitch_diagnostics
              return 1
            fi
          }

          assert_numeric() {
            if actual="$("$@")"; then
              :
            else
              rc=$?
              echo "::error::command failed with exit $rc: $*" >&2
              dump_freeswitch_diagnostics
              return "$rc"
            fi

            case "$actual" in
              ''|*[!0-9]*)
                echo "::error::expected numeric output, got '$actual': $*" >&2
                dump_freeswitch_diagnostics
                return 1
                ;;
            esac
          }

          ready=0
          for _ in $(seq 1 60); do
            if docker exec freeswitch-drain-test \
              fs_cli -H 127.0.0.1 -P 8021 -p test-password -x status >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::FreeSWITCH ESL did not become ready within 60 seconds" >&2
            docker logs freeswitch-drain-test >&2 || true
            exit 1
          fi

          drain=(docker exec freeswitch-drain-test /usr/local/bin/leamout-freeswitch-drain)

          assert_eq accepting "${drain[@]}" status
          assert_eq draining "${drain[@]}" enable
          assert_eq draining "${drain[@]}" status
          assert_numeric "${drain[@]}" channels
          assert_eq accepting "${drain[@]}" resume
          assert_eq accepting "${drain[@]}" status

  rtpengine:
    name: Build RTPengine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build RTPengine image
        run: |
          docker build \
            --file deploy/rtpengine/Dockerfile \
            --tag leamout/rtpengine:test \
            deploy/rtpengine
