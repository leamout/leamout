name: Regenerate Domain Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/temp-atlas.yml"
      - "server/migrations/*.sql"
      - "server/internal/database/queries/**"
      - "server/sqlc.yaml"
permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Format Go sources
        run: find server/internal/telecom/numbers -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Regenerate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Regenerate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/migrations/atlas.sum \
            server/internal/database/sqlc \
            server/internal/telecom/numbers
          if ! git diff --cached --quiet; then
            git commit -m "format numbers domain hardening changes"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
