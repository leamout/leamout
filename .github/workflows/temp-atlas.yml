name: Regenerate Domain Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/temp-atlas.yml"
      - "server/migrations/*.sql"
      - "server/internal/database/queries/**"
      - "server/sqlc.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-atlas.yml"
      - "server/migrations/*.sql"
      - "server/internal/database/queries/**"
      - "server/sqlc.yaml"
permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Finish managed routing ownership cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("server/internal/telecom/carriers/service.go")
          text = p.read_text()
          old = "OrganizationID:     organizationID,"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"carrier service: expected 2 ownership params, found {count}")
          p.write_text(text.replace(old, "OrganizationID:     &organizationID,"))

          p = Path("deploy/opensips/opensips.cfg")
          text = p.read_text()

          old = '''                "WITH matches AS (SELECT cc.organization_id, cc.id, max(masklen(src.cidr)) AS specificity FROM carrier_connection_source_ips AS src JOIN carrier_connections AS cc ON cc.id = src.carrier_connection_id AND cc.organization_id = src.organization_id WHERE '$si'::INET <<= src.cidr AND cc.status = 'active' AND cc.inbound_enabled = true AND cc.inbound_auth_method = 'ip' GROUP BY cc.organization_id, cc.id), best AS (SELECT max(specificity) AS specificity FROM matches), resolved AS (SELECT matches.organization_id, matches.id FROM matches JOIN best USING (specificity)) SELECT organization_id::text, id::text FROM resolved WHERE (SELECT count(*) FROM resolved) = 1 LIMIT 1",
                "$avp(carrier_org_id);$avp(carrier_connection_id)"'''
          new = '''                "WITH matches AS (SELECT cc.id, max(masklen(src.cidr)) AS specificity FROM carrier_connection_source_ips AS src JOIN carrier_connections AS cc ON cc.id = src.carrier_connection_id WHERE '$si'::INET <<= src.cidr AND src.organization_id IS NOT DISTINCT FROM cc.organization_id AND cc.status = 'active' AND cc.inbound_enabled = true AND cc.inbound_auth_method = 'ip' GROUP BY cc.id), best AS (SELECT max(specificity) AS specificity FROM matches), resolved AS (SELECT matches.id FROM matches JOIN best USING (specificity)) SELECT id::text FROM resolved WHERE (SELECT count(*) FROM resolved) = 1 LIMIT 1",
                "$avp(carrier_connection_id)"'''
          if old not in text:
              raise SystemExit("OpenSIPS source-IP resolver pattern not found")
          text = text.replace(old, new, 1)

          old = '''                    "SELECT organization_id::text, carrier_connection_id::text FROM opensips_inbound_carrier_credentials WHERE username = '$(au{s.escape.common})' AND domain = '$(ar{s.escape.common})' LIMIT 1",
                    "$avp(carrier_org_id);$avp(carrier_connection_id)"'''
          new = '''                    "SELECT carrier_connection_id::text FROM opensips_inbound_carrier_credentials WHERE username = '$(au{s.escape.common})' AND domain = '$(ar{s.escape.common})' LIMIT 1",
                    "$avp(carrier_connection_id)"'''
          if old not in text:
              raise SystemExit("OpenSIPS digest resolver pattern not found")
          text = text.replace(old, new, 1)

          old = '''    # Resolve DID -> voice binding -> active application, constrained by the
    # carrier identity established from source-IP authentication above.
    if (!sql_query_one(
            "SELECT pn.id::text, vb.id::text, va.id::text, va.ring_timeout_seconds::text FROM phone_numbers AS pn JOIN voice_bindings AS vb ON vb.phone_number_id = pn.id JOIN voice_applications AS va ON va.id = vb.voice_application_id JOIN organizations AS o ON o.id = pn.organization_id WHERE pn.number = '$rU' AND pn.organization_id = '$avp(carrier_org_id)'::UUID AND pn.carrier_connection_id = '$avp(carrier_connection_id)'::UUID AND pn.status = 'active' AND pn.voice_enabled = true AND va.organization_id = pn.organization_id AND va.status = 'active' AND o.status = 'active' AND o.deleted_at IS NULL LIMIT 1",
            "$avp(phone_number_id);$avp(voice_binding_id);$avp(voice_application_id);$avp(ring_timeout_seconds)"
        )) {'''
          new = '''    # The authenticated carrier connection identifies the ingress path; the
    # called DID supplies the tenant. BYOC also requires the connection owner
    # to match the DID owner, while platform ingress derives tenancy from the DID.
    if (!sql_query_one(
            "SELECT pn.organization_id::text, pn.id::text, vb.id::text, va.id::text, va.ring_timeout_seconds::text FROM phone_numbers AS pn JOIN carrier_connections AS cc ON cc.id = pn.carrier_connection_id JOIN voice_bindings AS vb ON vb.phone_number_id = pn.id JOIN voice_applications AS va ON va.id = vb.voice_application_id JOIN organizations AS o ON o.id = pn.organization_id WHERE pn.number = '$rU' AND pn.carrier_connection_id = '$avp(carrier_connection_id)'::UUID AND pn.status = 'active' AND pn.voice_enabled = true AND cc.status = 'active' AND cc.inbound_enabled = true AND ((cc.scope = 'organization' AND pn.provisioning_mode = 'byoc' AND cc.organization_id = pn.organization_id) OR (cc.scope = 'platform' AND pn.provisioning_mode = 'managed' AND cc.organization_id IS NULL)) AND va.organization_id = pn.organization_id AND va.status = 'active' AND o.status = 'active' AND o.deleted_at IS NULL LIMIT 1",
            "$avp(carrier_org_id);$avp(phone_number_id);$avp(voice_binding_id);$avp(voice_application_id);$avp(ring_timeout_seconds)"
        )) {'''
          if old not in text:
              raise SystemExit("OpenSIPS carrier ingress DID route pattern not found")
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Format Go sources
        run: find server -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Regenerate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Regenerate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            deploy/opensips/opensips.cfg \
            server \
            server/migrations/atlas.sum \
            server/internal/database/sqlc
          if ! git diff --cached --quiet; then
            git commit -m "feat: finish managed ingress ownership routing"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
