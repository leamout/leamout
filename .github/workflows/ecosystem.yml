name: Ecosystem compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "server/go.mod"
      - "server/internal/ai/**"
      - ".github/workflows/ecosystem.yml"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [released, source]
    steps:
      - name: Checkout Leamout
        uses: actions/checkout@v7
        with:
          path: leamout

      - name: Checkout contracts
        uses: actions/checkout@v7
        with:
          repository: leamout/contracts
          path: contracts

      - name: Checkout AI providers
        uses: actions/checkout@v7
        with:
          repository: leamout/ai-providers
          path: ai-providers

      - name: Checkout agents
        uses: actions/checkout@v7
        with:
          repository: leamout/agents
          path: agents

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: leamout/server/go.mod
          cache: false

      # Preserve HEAD-to-HEAD checks without replacing the released-dependency lane.
      - name: Use source contracts for provider checks
        if: matrix.dependencies == 'source'
        working-directory: ai-providers
        run: |
          go mod edit -replace github.com/leamout/contracts=../contracts
          go mod tidy

      - name: Use source adapters and contracts for runtime checks
        if: matrix.dependencies == 'source'
        working-directory: leamout/server
        run: |
          go mod edit -replace github.com/leamout/contracts=../../contracts
          go mod edit -replace github.com/leamout/ai-providers=../../ai-providers
          go mod tidy

      - name: Use source adapters and contracts for catalog checks
        if: matrix.dependencies == 'source'
        working-directory: agents
        run: |
          go mod edit -replace github.com/leamout/contracts=../contracts
          go mod edit -replace github.com/leamout/ai-providers=../ai-providers
          go mod tidy

      - name: Show released runtime dependencies
        if: matrix.dependencies == 'released'
        working-directory: leamout/server
        run: |
          go list -m github.com/leamout/contracts
          go list -m github.com/leamout/ai-providers

      - name: Validate contracts
        working-directory: contracts
        run: go test ./...

      - name: Validate providers against contracts
        working-directory: ai-providers
        run: go test ./...

      - name: Validate runtime AI boundaries
        working-directory: leamout/server
        run: go test ./internal/ai/catalog ./internal/ai/manifest

      - name: Validate agent catalog
        working-directory: agents
        run: |
          go run ./cmd/validate
          go test ./...
