name: Console

on:
  pull_request:
    paths:
      - "clients/**"
      - ".github/workflows/console.yml"
  push:
    branches:
      - main
    paths:
      - "clients/**"
      - ".github/workflows/console.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: clients
        run: bun install --frozen-lockfile

      - name: Check types
        working-directory: clients/apps/console
        run: bun run typecheck

      - name: Test authentication integration
        working-directory: clients/apps/console
        run: bun run test

      - name: Build console
        working-directory: clients/apps/console
        run: bun run build
