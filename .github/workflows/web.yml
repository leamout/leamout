name: Web

on:
  pull_request:
    paths:
      - "clients/apps/web/**"
      - "clients/packages/**"
      - "clients/bun.lock"
      - "clients/package.json"
      - "clients/biome.json"
      - "clients/turbo.json"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "clients/apps/web/**"
      - "clients/packages/**"
      - "clients/bun.lock"
      - "clients/package.json"
      - "clients/biome.json"
      - "clients/turbo.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: clients
        run: bun install --frozen-lockfile

      - name: Lint marketing website
        working-directory: clients/apps/web
        run: bun run lint

      - name: Check types
        working-directory: clients/apps/web
        run: bun run typecheck

      - name: Build marketing website
        working-directory: clients/apps/web
        run: bun run build
