name: Turborepo

on:
  pull_request:
    paths:
      - "clients/**"
      - ".github/workflows/turborepo.yml"
  push:
    branches:
      - main
    paths:
      - "clients/**"
      - ".github/workflows/turborepo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turborepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    name: Validate clients
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
