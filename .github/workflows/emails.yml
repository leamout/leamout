name: Emails

on:
  pull_request:
    paths:
      - "clients/packages/emails/**"
      - "clients/bun.lock"
      - "server/internal/platform/email/templates/**"
      - ".github/workflows/emails.yml"

  push:
    branches:
      - main
    paths:
      - "clients/packages/emails/**"
      - "clients/bun.lock"
      - "server/internal/platform/email/templates/**"
      - ".github/workflows/emails.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check email types
        run: bun run --cwd packages/emails typecheck

      - name: Check formatting
        run: bun run --cwd packages/emails lint

      - name: Export templates
        run: bun run --cwd packages/emails export

      - name: Verify generated templates
        run: git diff --exit-code -- ../server/internal/platform/email/templates
