name: Emails

on:
  push:
    branches:
      - main
    paths:
      - "clients/packages/emails/**"
      - "clients/bun.lock"
      - "server/internal/platform/email/**"
      - ".github/workflows/emails.yml"
  pull_request:
    paths:
      - "clients/packages/emails/**"
      - "clients/bun.lock"
      - "server/internal/platform/email/**"
      - ".github/workflows/emails.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    name: Validate generated templates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and types
        run: |
          bun run --cwd packages/emails lint
          bun run --cwd packages/emails typecheck

      - name: Export Go email templates
        run: bun run --cwd packages/emails export

      - name: Check generated templates
        run: git diff --exit-code -- ../server/internal/platform/email/templates
