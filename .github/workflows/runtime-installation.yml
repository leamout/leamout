name: Runtime Installation

on:
  pull_request:
    paths:
      - "server/cmd/leamout/**"
      - "server/internal/runtime/leamout/**"
      - "tests/acceptance/self-hosted-lifecycle/**"
      - "tests/acceptance/self-hosted-lifecycle/**"
          for VERSION in 1.0.0-preview.1 1.0.0-preview.2; do
            mkdir -p "/tmp/self-hosted-release/$VERSION"
            (
              cd server
              go build \
                -trimpath \
                -ldflags "-s -w -X main.version=$VERSION -X main.commit=${GITHUB_SHA} -X main.builtAt=1970-01-01T00:00:00Z" \
                -o "/tmp/leamout-$VERSION" \
                ./cmd/leamout
            )
            VERSION="$VERSION" \
            CLI_BINARY="/tmp/leamout-$VERSION" \
            OUT_DIR="/tmp/self-hosted-release/$VERSION" \
            sh server/scripts/release/package-cli.sh >/dev/null
            VERSION="$VERSION" \
            OUT_DIR="/tmp/self-hosted-release/$VERSION" \
            sh server/scripts/release/package-runtime.sh >/dev/null
            sed \
              -e "s/1.0.0-preview.1/$VERSION/g" \
              server/release/fixtures/valid-manifest.json \
              > "/tmp/self-hosted-release/$VERSION/release-manifest.json"
            : > "/tmp/self-hosted-release/$VERSION/checksums.txt.minisig"
            : > "/tmp/self-hosted-release/$VERSION/release-manifest.json.minisig"
            test "$(wc -l < "/tmp/self-hosted-release/$VERSION/checksums.txt")" -eq 2
            (
              cd "/tmp/self-hosted-release/$VERSION"
              sha256sum --check checksums.txt
            )
          done

      - name: Exercise packaged Self-Hosted lifecycle without repository deployment assets

            for argument in "$@"; do
              case "$argument" in
                dialogs|channels) echo 0; exit 0 ;;
                pg_dump) echo '-- packaged lifecycle database fixture'; exit 0 ;;
              esac
            done
            for argument in "$@"; do
              if [ "$argument" = --wait ] && [ -f /tmp/leamout-fail-next-up ]; then
                rm -f /tmp/leamout-fail-next-up
                exit 42
              fi
            done
          sudo python3 "$GITHUB_WORKSPACE/tests/acceptance/self-hosted-lifecycle/acceptance.py" initialized --version "$VERSION"
          sudo rm -rf /tmp/leamout-license-fixture
          (
            cd "$GITHUB_WORKSPACE/server"
            sudo env PATH="$PATH" go run ./internal/runtime/leamout/testdata/generate-license \
              --deployment /var/lib/leamout/deployment.json \
              --out /tmp/leamout-license-fixture
          )
          sudo /usr/local/bin/leamout license install \
            --artifact /tmp/leamout-license-fixture/license.json \
            --keyring /tmp/leamout-license-fixture/keyring.json

          sudo env \
            PATH="/tmp/installer-tools:$PATH" \
            LEAMOUT_OS_RELEASE_FILE=/tmp/installer-os-release \
            LEAMOUT_MINISIGN_PUBLIC_KEY=fixture-public-key \
            LEAMOUT_RELEASE_BASE_URL=file:///tmp/self-hosted-release \
            sh "$GITHUB_WORKSPACE/deploy/self-hosted/install.sh" --version 1.0.0-preview.2
          touch /tmp/leamout-fail-next-up
          if sudo env PATH="/tmp/installer-tools:$PATH" /usr/local/bin/leamout update; then
            echo "candidate failure fixture unexpectedly updated successfully" >&2
            exit 1
          fi
          sudo grep -q '"release_version": "1.0.0-preview.1"' /var/lib/leamout/runtime/release.json
          sudo test ! -e /var/lib/leamout/runtime.previous
          sudo test ! -e /var/lib/leamout/update.json
          sudo env PATH="/tmp/installer-tools:$PATH" /usr/local/bin/leamout update
          sudo grep -q '"release_version": "1.0.0-preview.2"' /var/lib/leamout/runtime/release.json
          sudo test ! -e /var/lib/leamout/runtime.previous
          sudo find /var/lib/leamout/backups -name 'pre-update-1.0.0-preview.1-to-1.0.0-preview.2-*.tar.gz' -type f | grep -q .
          sudo cmp /tmp/deployment-before /var/lib/leamout/deployment.json
          sudo python3 "$GITHUB_WORKSPACE/tests/acceptance/self-hosted-lifecycle/acceptance.py" updated --version 1.0.0-preview.2

          sudo python3 "$GITHUB_WORKSPACE/tests/acceptance/self-hosted-lifecycle/acceptance.py" uninstalled
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test runtime installer
        working-directory: server
        run: go test ./internal/runtime/leamout

      - name: Build release fixture
        run: |
          VERSION=1.0.0-preview.1
          mkdir -p "/tmp/self-hosted-release/$VERSION"

          (
            cd server
            go build \
              -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=${GITHUB_SHA} -X main.builtAt=1970-01-01T00:00:00Z" \
              -o /tmp/leamout \
              ./cmd/leamout
          )

          VERSION="$VERSION" \
          CLI_BINARY=/tmp/leamout \
          OUT_DIR="/tmp/self-hosted-release/$VERSION" \
          sh server/scripts/release/package-cli.sh >/dev/null

          VERSION="$VERSION" \
          OUT_DIR="/tmp/self-hosted-release/$VERSION" \
          sh server/scripts/release/package-runtime.sh >/dev/null

          cp server/release/fixtures/valid-manifest.json "/tmp/self-hosted-release/$VERSION/release-manifest.json"
          : > "/tmp/self-hosted-release/$VERSION/checksums.txt.minisig"
          : > "/tmp/self-hosted-release/$VERSION/release-manifest.json.minisig"

          test "$(wc -l < "/tmp/self-hosted-release/$VERSION/checksums.txt")" -eq 2
          (
            cd "/tmp/self-hosted-release/$VERSION"
            sha256sum --check checksums.txt
          )

      - name: Exercise bootstrap and init without repository deployment assets
        run: |
          VERSION=1.0.0-preview.1
          mkdir -p /tmp/installer-tools

          cat > /tmp/installer-os-release <<'EOF'
          ID=ubuntu
          VERSION_ID=24.04
          EOF

          cat > /tmp/installer-tools/uname <<'EOF'
          #!/bin/sh
          case "$1" in
            -s) echo Linux ;;
            -m) echo x86_64 ;;
            -r) echo 6.8.0 ;;
            *) exit 1 ;;
          esac
          EOF

          cat > /tmp/installer-tools/docker <<'EOF'
          #!/bin/sh
          if [ "$1" = version ]; then
            echo 27.5.1
          elif [ "$1" = compose ] && [ "$2" = version ]; then
            echo 2.32.4
          else
            exit 1
          fi
          EOF

          cat > /tmp/installer-tools/systemctl <<'EOF'
          #!/bin/sh
          echo 'systemd 255'
          EOF

          cat > /tmp/installer-tools/minisign <<'EOF'
          #!/bin/sh
          exit 0
          EOF

          chmod +x /tmp/installer-tools/*

          sudo rm -rf /etc/leamout /var/lib/leamout /var/log/leamout /usr/local/bin/leamout
          sudo env \
            PATH="/tmp/installer-tools:$PATH" \
            LEAMOUT_OS_RELEASE_FILE=/tmp/installer-os-release \
            LEAMOUT_MINISIGN_PUBLIC_KEY=fixture-public-key \
            LEAMOUT_RELEASE_BASE_URL=file:///tmp/self-hosted-release \
            sh server/scripts/install.sh --version "$VERSION"

          cd /tmp
          sudo /usr/local/bin/leamout init

          sudo test -f /etc/leamout/leamout.env
          sudo test -f /var/lib/leamout/deployment.json
          sudo test -f /var/lib/leamout/runtime/compose.yaml
          sudo test -f /var/lib/leamout/runtime/release.json
          sudo test -f /var/lib/leamout/runtime/migrations/048_create_provider_cdr_pages.sql
          sudo test ! -e /var/lib/leamout/runtime/compose.yaml.tmpl
          ! sudo grep -q '@@IMAGE_' /var/lib/leamout/runtime/compose.yaml
          ! sudo grep -Eq '^[[:space:]]*build:' /var/lib/leamout/runtime/compose.yaml

          sudo cp /etc/leamout/leamout.env /tmp/leamout-env-before
          sudo cp /var/lib/leamout/deployment.json /tmp/deployment-before
          sudo /usr/local/bin/leamout init
          sudo cmp /tmp/leamout-env-before /etc/leamout/leamout.env
          sudo cmp /tmp/deployment-before /var/lib/leamout/deployment.json

          cd /tmp
          ! grep -q 'deploy/compose.yaml' < <(/usr/local/bin/leamout help)
