name: Refactor generated artifacts

on:
  pull_request:
    paths:
      - "server/**"
      - "containers/opensips/**"
      - ".github/workflows/refactor-generated-artifacts.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def sub(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f"missing pattern in {path}")
              p.write_text(s.replace(old,new))

          sub("server/internal/telecom/numbers/repository.go", "\n\t\tProviderConnectionID: providerConnectionID,", "")
          sub("server/internal/database/queries/managed_routing.sql", "AND pn.provider_connection_id = cc.id", "AND pn.carrier_connection_id IS NULL")
          sub("server/internal/database/queries/calls.sql", "AND pn.provider_connection_id = cc.id", "AND pn.carrier_connection_id IS NULL")
          sub("server/internal/telecom/routing/resolver.go", "connection.OrganizationID != nil ||\n\t\t\tphoneNumber.ProviderConnectionID == nil ||\n\t\t\t*phoneNumber.ProviderConnectionID != connection.ID", "connection.OrganizationID != nil || phoneNumber.CarrierConnectionID != nil")
          sub("containers/opensips/cloud/opensips.cfg", "pn.provider_connection_id = cc.id", "pn.carrier_connection_id IS NULL")

          p=Path("server/internal/database/queries/phone_numbers.sql"); s=p.read_text()
          for old in ["    provider_connection_id,\n", "    NULL::UUID AS provider_connection_id,\n", "    provider_cc.id AS provider_connection_id,\n", "    CAST(COALESCE(pn.provider_connection_id::TEXT, '—') AS TEXT) AS provider_connection_id,\n", "    COALESCE(provider_cc.name, '—') AS provider_connection_name,\n", "LEFT JOIN carrier_connections AS provider_cc ON provider_cc.id = pn.provider_connection_id\n"]: s=s.replace(old,"")
          s=s.replace("JOIN carrier_connections AS provider_cc\n  ON provider_cc.id = sqlc.arg(provider_connection_id)\n AND provider_cc.scope = 'platform'\n AND provider_cc.organization_id IS NULL\n AND provider_cc.provider_id = cp.id\n AND provider_cc.status = 'active'\n","")
          if "provider_connection_id" in s: raise SystemExit("provider_connection_id remains in phone_numbers.sql")
          p.write_text(s)

          p=Path("server/internal/backoffice/numbers/model.go"); s=p.read_text().replace("\tProviderConnectionID string\n","").replace("\tProviderConnection   string\n",""); p.write_text(s)
          p=Path("server/internal/backoffice/numbers/repository.go"); s=p.read_text().replace("\n\t\tProviderConnectionID: row.ProviderConnectionID,","").replace("\n\t\tProviderConnection:   row.ProviderConnectionName,",""); p.write_text(s)
          p=Path("server/internal/backoffice/numbers/pages.templ"); s=p.read_text().replace("\n\t\t\t\t@DetailField(\"Provider connection\", number.ProviderConnection)","").replace("\n\t\t\t\t@DetailField(\"Provider connection ID\", number.ProviderConnectionID)",""); p.write_text(s)
          p=Path("server/internal/telecom/routing/resolver_test.go"); s=p.read_text().replace("OrganizationID: organizationID, ProviderConnectionID: &connectionID,", "OrganizationID: organizationID,"); p.write_text(s)

          sub("server/internal/telecom/calls/repository.go", "CalledNumber:        event.To,\n\t\tCarrierConnectionID: &event.CarrierConnectionID,\n\t\tApplicationID:", "CalledNumber:        event.To,\n\t\tCarrierConnectionID: event.CarrierConnectionID,\n\t\tApplicationID:")
          PY

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Format and regenerate
        run: |
          gofmt -w server/internal/telecom/numbers server/internal/telecom/routing server/internal/telecom/calls server/internal/backoffice/numbers
          cd server
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
          cd ..
          docker run --rm -v "${PWD}/server/migrations:/migrations" arigaio/atlas:1.3.0-alpine migrate hash --dir file:///migrations

      - name: Verify
        run: |
          ! grep -R -n "provider_connection_id" server/migrations/017_create_phone_numbers.sql server/internal/database/queries server/internal/telecom server/internal/backoffice/numbers containers/opensips
          cd server
          go test ./internal/telecom/numbers ./internal/telecom/routing ./internal/telecom/calls ./internal/backoffice/numbers
          go build ./...

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server containers/opensips/cloud/opensips.cfg
          git commit -m "refactor: clean phone number carrier model" || exit 0
          git push origin HEAD:${{ github.head_ref }}
