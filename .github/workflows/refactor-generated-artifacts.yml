name: Refactor generated artifacts

on:
  pull_request:
    paths:
      - "server/internal/database/queries/trunks.sql"
      - "server/migrations/**"
      - ".github/workflows/refactor-generated-artifacts.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Generate sqlc
        working-directory: server
        run: sqlc generate

      - name: Hash Atlas migrations
        run: |
          docker run --rm \
            -v "${PWD}/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: refactor-generated-artifacts
          path: |
            server/internal/database/sqlc/trunks.sql.go
            server/migrations/atlas.sum
