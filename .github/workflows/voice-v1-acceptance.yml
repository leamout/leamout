name: Voice v1 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "tests/acceptance/voice-v1/**"
      - ".github/workflows/voice-v1-acceptance.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Self-hosted programmable voice
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Voice v1 acceptance suite
        run: sh tests/acceptance/voice-v1/run.sh
