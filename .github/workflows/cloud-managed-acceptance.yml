name: Cloud managed carrier acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "tests/acceptance/cloud-managed/**"
      - ".github/workflows/cloud-managed-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: cloud-managed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Managed number purchase on cloud topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate acceptance scripts
        run: |
          sh -n tests/acceptance/cloud-managed/run.sh
          python3 -m py_compile tests/acceptance/cloud-managed/acceptance.py tests/acceptance/cloud-managed/fake_provider.py
      - name: Run Cloud + Managed Carrier acceptance
        run: sh tests/acceptance/cloud-managed/run.sh
