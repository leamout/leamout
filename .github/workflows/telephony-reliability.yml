name: Telephony failure injection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/internal/integrations/freeswitch/**"
      - "server/internal/telephony/calls/**"
      - "server/internal/runtime/worker/**"
      - "tests/voice-v1/**"
      - ".github/workflows/telephony-reliability.yml"

permissions:
  contents: read

concurrency:
  group: telephony-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Validate failure injection script
        run: |
          sh -n tests/voice-v1/run.sh
          python3 -m py_compile tests/voice-v1/acceptance.py
      - name: Run telephony failure injection
        env:
          VOICE_V1_FAILURE_INJECTION: "1"
        run: sh tests/voice-v1/run.sh
