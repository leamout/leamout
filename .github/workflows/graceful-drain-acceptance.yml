name: Graceful drain acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/**"
      - "server/**"
      - "tests/acceptance/graceful-drain/**"
      - ".github/workflows/graceful-drain-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: graceful-drain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-path:
    name: Establish SIP/media call
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate acceptance scripts
        run: |
          sh -n tests/acceptance/graceful-drain/run.sh
          python3 -m py_compile tests/acceptance/graceful-drain/acceptance.py

      - name: Establish OpenSIPS to FreeSWITCH to RTPengine call
        run: sh tests/acceptance/graceful-drain/run.sh
