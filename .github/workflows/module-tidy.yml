name: One-shot server module tidy

on:
  push:
    branches: [feat/ecosystem-sync-v1]
    paths: [".github/workflows/module-tidy.yml"]

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ecosystem-sync-v1
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false
      - working-directory: server
        run: go mod tidy
      - run: rm .github/workflows/module-tidy.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: tidy ecosystem dependencies"
          git push origin HEAD:feat/ecosystem-sync-v1
