name: Server

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build server
        run: go build ./...

  sqlc:
    name: Validate sqlc
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Install generators
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install ariga.io/atlas/cmd/atlas@latest

      - name: Generate sqlc
        run: sqlc generate

      - name: Hash migrations
        run: atlas migrate hash --dir file://migrations

      - name: Commit generated artifacts
        working-directory: .
        run: |
          if git diff --quiet -- server/internal/database/sqlc server/migrations/atlas.sum && test -z "$(git status --porcelain -- server/internal/database/sqlc server/migrations/atlas.sum)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/database/sqlc server/migrations/atlas.sum
          git commit -m "Regenerate commercial database artifacts"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check generated code
        run: git diff --exit-code -- internal/database/sqlc migrations/atlas.sum
