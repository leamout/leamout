name: Secure WebRTC acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forced-turn-relay:
    name: WSS and forced TURN relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acceptance/webrtc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: acceptance/webrtc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run forced-relay browser call
        run: npm test
        env:
          LEAMOUT_API_URL: ${{ secrets.WEBRTC_API_URL }}
          LEAMOUT_API_TOKEN: ${{ secrets.WEBRTC_API_TOKEN }}
          LEAMOUT_ORGANIZATION_ID: ${{ secrets.WEBRTC_ORGANIZATION_ID }}
          LEAMOUT_WSS_URL: ${{ secrets.WEBRTC_WSS_URL }}
          LEAMOUT_SIP_URI: ${{ secrets.WEBRTC_SIP_URI }}
          LEAMOUT_SIP_USERNAME: ${{ secrets.WEBRTC_SIP_USERNAME }}
          LEAMOUT_SIP_PASSWORD: ${{ secrets.WEBRTC_SIP_PASSWORD }}
          LEAMOUT_DESTINATION_URI: ${{ secrets.WEBRTC_DESTINATION_URI }}
