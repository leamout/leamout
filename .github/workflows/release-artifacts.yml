name: Release Artifacts

on:
  pull_request:
    paths:
      - "server/release/**"
      - "server/scripts/release/**"
      - "server/scripts/install.sh"
      - "server/cmd/leamout/**"
      - "server/internal/runtime/leamout/**"
      - "server/go.mod"
      - "server/go.sum"
      - "server/scripts/deploy/**"
      - "docs/deploy/release-artifacts.md"
      - "docs/deploy/self-hosted-installation.md"
      - "deploy/compose.yaml"
      - "LICENSE"
      - ".github/workflows/release-artifacts.yml"
  push:
    branches:
      - main
    paths:
      - "server/release/**"
      - "server/scripts/release/**"
      - "server/scripts/install.sh"
      - "server/cmd/leamout/**"
      - "server/internal/runtime/leamout/**"
      - "server/go.mod"
      - "server/go.sum"
      - "server/scripts/deploy/**"
      - "docs/deploy/release-artifacts.md"
      - "docs/deploy/self-hosted-installation.md"
      - "deploy/compose.yaml"
      - "LICENSE"
      - ".github/workflows/release-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check release and installer tooling syntax
        run: |
          sh -n server/scripts/release/package-cli.sh
          sh -n server/scripts/install.sh
          sh -n server/scripts/deploy/up.sh
          python3 -m py_compile server/scripts/release/validate-manifest.py

      - name: Test operator CLI
        working-directory: server
        run: go test ./internal/runtime/leamout

      - name: Build operator CLI
        working-directory: server
        run: |
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=1.0.0-preview.1 -X main.commit=${GITHUB_SHA} -X main.builtAt=1970-01-01T00:00:00Z" \
            -o /tmp/leamout \
            ./cmd/leamout
          /tmp/leamout version
          /tmp/leamout help >/dev/null

      - name: Validate manifest schema JSON
        run: python3 -m json.tool server/release/manifest.schema.json >/dev/null

      - name: Validate known-good manifest
        run: python3 server/scripts/release/validate-manifest.py server/release/fixtures/valid-manifest.json

      - name: Reject mutable image references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("server/release/fixtures/valid-manifest.json")
          manifest = json.loads(source.read_text())
          manifest["images"]["rtpengine"] = "ghcr.io/leamout/rtpengine:dev"
          Path("/tmp/mutable-manifest.json").write_text(json.dumps(manifest))
          PY

          if python3 server/scripts/release/validate-manifest.py /tmp/mutable-manifest.json; then
            echo "validator unexpectedly accepted a mutable image reference" >&2
            exit 1
          fi

      - name: Reject placeholder image digests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("server/release/fixtures/valid-manifest.json")
          manifest = json.loads(source.read_text())
          manifest["images"]["server"] = "ghcr.io/leamout/server@sha256:" + ("0" * 64)
          Path("/tmp/placeholder-manifest.json").write_text(json.dumps(manifest))
          PY

          if python3 server/scripts/release/validate-manifest.py /tmp/placeholder-manifest.json; then
            echo "validator unexpectedly accepted an all-zero image digest" >&2
            exit 1
          fi

      - name: Reject hosted frontend images
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("server/release/fixtures/valid-manifest.json")
          for frontend in ("console", "web"):
              manifest = json.loads(source.read_text())
              manifest["images"][frontend] = (
                  f"ghcr.io/leamout/{frontend}@sha256:" + ("f" * 64)
              )
              target = Path(f"/tmp/{frontend}-manifest.json")
              target.write_text(json.dumps(manifest))
          PY

          for frontend in console web; do
            if python3 server/scripts/release/validate-manifest.py "/tmp/${frontend}-manifest.json"; then
              echo "validator unexpectedly accepted hosted frontend image: ${frontend}" >&2
              exit 1
            fi
          done

      - name: Exercise real CLI artifact format
        run: |
          VERSION=1.0.0-preview.1 \
          CLI_BINARY=/tmp/leamout \
          OUT_DIR=/tmp/leamout-release \
          sh server/scripts/release/package-cli.sh

          test -f /tmp/leamout-release/leamout_1.0.0-preview.1_linux_amd64.tar.gz
          test -f /tmp/leamout-release/checksums.txt

          tar -tzf /tmp/leamout-release/leamout_1.0.0-preview.1_linux_amd64.tar.gz > /tmp/archive-files.txt
          diff -u <(printf 'LICENSE\nleamout\n') /tmp/archive-files.txt

          (
            cd /tmp/leamout-release
            sha256sum --check checksums.txt
          )

      - name: Verify deterministic CLI packaging
        run: |
          VERSION=1.0.0-preview.1 CLI_BINARY=/tmp/leamout OUT_DIR=/tmp/release-a sh server/scripts/release/package-cli.sh >/dev/null
          VERSION=1.0.0-preview.1 CLI_BINARY=/tmp/leamout OUT_DIR=/tmp/release-b sh server/scripts/release/package-cli.sh >/dev/null

          cmp \
            /tmp/release-a/leamout_1.0.0-preview.1_linux_amd64.tar.gz \
            /tmp/release-b/leamout_1.0.0-preview.1_linux_amd64.tar.gz

      - name: Verify self-hosted runtime service boundary
        run: |
          for service in server worker opensips coturn freeswitch rtpengine postgres redis nats migrate; do
            grep -q "^  ${service}:$" server/release/runtime/compose.yaml.tmpl
          done
          if grep -Eq '^  (console|web|waitlist):$' server/release/runtime/compose.yaml.tmpl; then
            echo "self-hosted runtime unexpectedly includes a hosted frontend service" >&2
            exit 1
          fi
