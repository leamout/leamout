name: BYOC v1 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "tests/acceptance/byoc-v1/**"
      - "tests/acceptance/voice-v1/carrier-dialplan.xml"
      - ".github/workflows/byoc-v1-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: byoc-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Customer-owned SIP carrier
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run BYOC v1 acceptance suite
        run: sh tests/acceptance/byoc-v1/run.sh

