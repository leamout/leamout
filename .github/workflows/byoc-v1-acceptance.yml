name: BYOC v1 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "tests/acceptance/byoc-v1/**"
      - ".github/workflows/byoc-v1-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: byoc-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Customer-owned SIP carrier
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate BYOC v1 acceptance scripts
        run: |
          sh -n tests/acceptance/byoc-v1/run.sh
          python3 -m py_compile tests/acceptance/byoc-v1/acceptance.py

      - name: Run BYOC v1 acceptance suite
        run: sh tests/acceptance/byoc-v1/run.sh
