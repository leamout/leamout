x-leamout-environment: &leamout-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgres://leamout:leamout@postgres:5432/leamout?sslmode=disable
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  NATS_STREAM_REPLICAS: ${NATS_STREAM_REPLICAS:-1}
  FREESWITCH_ESL_ADDRESS: freeswitch:8021
  FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
  CARRIER_CREDENTIAL_ENCRYPTION_KEY: ${CARRIER_CREDENTIAL_ENCRYPTION_KEY:?CARRIER_CREDENTIAL_ENCRYPTION_KEY is required}
  TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:?TURN_AUTH_SECRET is required}
  TURN_PUBLIC_URLS: ${TURN_PUBLIC_URLS:?TURN_PUBLIC_URLS is required}
  TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL:-10m}
  TURN_CREDENTIAL_ISSUE_LIMIT: ${TURN_CREDENTIAL_ISSUE_LIMIT:-60}
  TURN_CREDENTIAL_ISSUE_WINDOW: ${TURN_CREDENTIAL_ISSUE_WINDOW:-1m}
  ENDPOINT_HEALTH_INTERVAL: ${ENDPOINT_HEALTH_INTERVAL:-10s}
  ENDPOINT_HEALTH_PROBE_TIMEOUT: ${ENDPOINT_HEALTH_PROBE_TIMEOUT:-2s}
  ENDPOINT_HEALTH_COOLDOWN: ${ENDPOINT_HEALTH_COOLDOWN:-30s}
  ENDPOINT_HEALTH_FAILURE_THRESHOLD: ${ENDPOINT_HEALTH_FAILURE_THRESHOLD:-3}
  ENDPOINT_HEALTH_BATCH_SIZE: ${ENDPOINT_HEALTH_BATCH_SIZE:-100}
  ENDPOINT_HEALTH_CONCURRENCY: ${ENDPOINT_HEALTH_CONCURRENCY:-10}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leamout
      POSTGRES_USER: leamout
      POSTGRES_PASSWORD: leamout
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leamout -d leamout"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leamout-core

  migrate:
    image: arigaio/atlas:1.3.0-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /atlas migrate apply --dir file:///migrations --url "$$DATABASE_URL"
    environment:
      DATABASE_URL: postgres://leamout:leamout@postgres:5432/leamout?sslmode=disable&search_path=public
    volumes:
      - ../server/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leamout-core

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - leamout-core

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - leamout-core

  server:
    image: leamout/server:1.0.0
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *leamout-environment
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      freeswitch:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - leamout-core

  worker:
    image: leamout/worker:1.0.0
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["/leamout/worker"]
    restart: unless-stopped
    environment: *leamout-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - leamout-core

  web:
    image: leamout/web:1.0.0
    build:
      context: ../clients
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - leamout-core

  console:
    image: leamout/console:1.0.0
    build:
      context: ../clients
      dockerfile: apps/console/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - leamout-core

  waitlist:
    image: leamout/waitlist:1.0.0
    build:
      context: ../clients
      dockerfile: apps/waitlist/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - leamout-core

  opensips:
    image: leamout/opensips:4.0.1
    build:
      context: ./opensips
      dockerfile: Dockerfile
      args:
        OPENSIPS_VERSION: 4.0.1
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
    volumes:
      - ${OPENSIPS_TLS_CERTIFICATE_PATH:?OPENSIPS_TLS_CERTIFICATE_PATH is required}:/etc/opensips/tls/fullchain.pem:ro
      - ${OPENSIPS_TLS_PRIVATE_KEY_PATH:?OPENSIPS_TLS_PRIVATE_KEY_PATH is required}:/etc/opensips/tls/privkey.pem:ro
      - ${OPENSIPS_TLS_CA_BUNDLE_PATH:?OPENSIPS_TLS_CA_BUNDLE_PATH is required}:/etc/opensips/tls/carrier-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_started
      freeswitch:
        condition: service_started
    networks:
      - leamout-core

  coturn:
    image: coturn/coturn:4.17.0-r0
    restart: unless-stopped
    command:
      - --config
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --static-auth-secret=${TURN_AUTH_SECRET:?TURN_AUTH_SECRET is required}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    networks:
      - leamout-core

  freeswitch:
    image: leamout/freeswitch:1.0.0
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
    volumes:
      - freeswitch_recordings:/var/lib/freeswitch/recordings
    expose:
      - "5060/udp"
      - "5060/tcp"
      - "8021/tcp"
    networks:
      leamout-core:
        ipv4_address: 172.30.0.20

  rtpengine:
    image: leamout/rtpengine:dev
    build:
      context: ./rtpengine
      dockerfile: Dockerfile
      args:
        RTPENGINE_REF: mr26.2.1
    restart: unless-stopped
    environment:
      RTPENGINE_PUBLIC_IP: ${RTPENGINE_PUBLIC_IP}
    ports:
      - "23000-32768:23000-32768/udp"
    expose:
      - "22222/udp"
    networks:
      leamout-core:
        ipv4_address: 172.30.0.10

volumes:
  postgres_data:
  redis_data:
  nats_data:
  freeswitch_recordings:

networks:
  leamout-core:
    name: leamout-core
    ipam:
      config:
        - subnet: 172.30.0.0/24
