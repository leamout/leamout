x-leamout-environment: &leamout-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgres://leamout:leamout@postgres:5432/leamout?sslmode=disable
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  FREESWITCH_ESL_ADDRESS: freeswitch:8021
  FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leamout
      POSTGRES_USER: leamout
      POSTGRES_PASSWORD: leamout
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leamout -d leamout"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leamout-core

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - leamout-core

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - leamout-core

  api:
    image: leamout/api:dev
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        LEAMOUT_COMMAND: server
    restart: unless-stopped
    environment: *leamout-environment
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      freeswitch:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - leamout-core

  worker:
    image: leamout/worker:dev
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        LEAMOUT_COMMAND: worker
    restart: unless-stopped
    environment: *leamout-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - leamout-core

  opensips:
    image: opensips/opensips:3.4
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    volumes:
      - ./opensips/opensips.cfg:/etc/opensips/opensips.cfg:ro
      - ./opensips/tls.cfg:/etc/opensips/tls.cfg:ro
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_started
      freeswitch:
        condition: service_started
    networks:
      - leamout-core

  coturn:
    image: coturn/coturn:4.17.0-r0
    restart: unless-stopped
    command:
      - --config
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --static-auth-secret=${TURN_AUTH_SECRET:?TURN_AUTH_SECRET is required}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    networks:
      - leamout-core

  freeswitch:
    image: leamout/freeswitch:1.0.0
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
    volumes:
      - freeswitch_recordings:/var/lib/freeswitch/recordings
    expose:
      - "5060/udp"
      - "5060/tcp"
      - "8021/tcp"
    networks:
      - leamout-core

  rtpengine:
    image: leamout/rtpengine:dev
    build:
      context: ./rtpengine
      dockerfile: Dockerfile
      args:
        RTPENGINE_REF: mr26.2.1
    restart: unless-stopped
    environment:
      RTPENGINE_PUBLIC_IP: ${RTPENGINE_PUBLIC_IP}
    ports:
      - "23000-32768:23000-32768/udp"
    expose:
      - "22222/udp"
    networks:
      leamout-core:
        ipv4_address: 172.30.0.10

volumes:
  postgres_data:
  redis_data:
  nats_data:
  freeswitch_recordings:

networks:
  leamout-core:
    name: leamout-core
    ipam:
      config:
        - subnet: 172.30.0.0/24
