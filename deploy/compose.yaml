services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leamout
      POSTGRES_USER: leamout
      POSTGRES_PASSWORD: leamout
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leamout -d leamout"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - leamout-core

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - leamout-core

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - leamout-core

  migrate:
    image: arigaio/atlas:1.3.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../server/db/migrations:/workspace/migrations:ro
    command:
      - /bin/sh
      - -c
      - >-
        exec /atlas migrate apply
        --dir file:///workspace/migrations
        --url postgres://leamout:leamout@postgres:5432/leamout?sslmode=disable
    networks:
      - leamout-core

  server:
    image: leamout/server:1.0.0
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://leamout:leamout@postgres:5432/leamout?sslmode=disable
      REDIS_ADDRESS: redis:6379
      NATS_URL: nats://nats:4222
      FREESWITCH_ESL_ADDRESS: freeswitch:8021
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
      CARRIER_CREDENTIAL_ENCRYPTION_KEY: ${CARRIER_CREDENTIAL_ENCRYPTION_KEY:?CARRIER_CREDENTIAL_ENCRYPTION_KEY is required}
      TURN_REALM: ${TURN_REALM:?TURN_REALM is required}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:?TURN_AUTH_SECRET is required}
      TURN_PUBLIC_URLS: ${TURN_PUBLIC_URLS:?TURN_PUBLIC_URLS is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      freeswitch:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - leamout-core

  opensips:
    image: leamout/opensips:4.0.1
    build:
      context: ./opensips
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "5062:5062/tcp"
    volumes:
      - ./deploy/certs/fullchain.pem:/etc/opensips/tls/fullchain.pem:ro
      - ./deploy/certs/privkey.pem:/etc/opensips/tls/privkey.pem:ro
      - ./deploy/certs/carrier-ca.pem:/etc/opensips/tls/carrier-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_started
      freeswitch:
        condition: service_started
    networks:
      - leamout-core

  coturn:
    image: coturn/coturn:4.17.0-r0
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --static-auth-secret=${TURN_AUTH_SECRET:?TURN_AUTH_SECRET is required}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --cert=/etc/coturn/tls/fullchain.pem
      - --pkey=/etc/coturn/tls/privkey.pem
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./deploy/certs/fullchain.pem:/etc/coturn/tls/fullchain.pem:ro
      - ./deploy/certs/privkey.pem:/etc/coturn/tls/privkey.pem:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    networks:
      - leamout-core

  freeswitch:
    image: leamout/freeswitch:1.0.0
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
    volumes:
      - freeswitch_recordings:/var/lib/freeswitch/recordings
    expose:
      - "5060/udp"
      - "5060/tcp"
      - "8021/tcp"
    networks:
      leamout-core:
        ipv4_address: 172.30.0.20

  rtpengine:
    image: leamout/rtpengine:dev
    build:
      context: ./rtpengine
      dockerfile: Dockerfile
      args:
        RTPENGINE_REF: mr26.2.1
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RTPENGINE_PUBLIC_IP: ${RTPENGINE_PUBLIC_IP}
    ports:
      - "23000-32768:23000-32768/udp"
    expose:
      - "22222/udp"
    networks:
      leamout-core:
        ipv4_address: 172.30.0.10

volumes:
  postgres_data:
  redis_data:
  nats_data:
  freeswitch_recordings:

networks:
  leamout-core:
    name: leamout-core
    ipam:
      config:
        - subnet: 172.30.0.0/24