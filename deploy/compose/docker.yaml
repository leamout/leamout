name: leamout-cloud

services:
  keycloak-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [control]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start", "--import-realm"]
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: https://auth.${DOMAIN:-leamout.com}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.32.0.0/24
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    volumes:
      - ../keycloak/leamout-realm.json:/opt/keycloak/data/import/leamout-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks: [control]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leamout
      POSTGRES_USER: leamout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leamout -d leamout"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [control]

  migrate:
    image: arigaio/atlas:1.3.0-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'exec /atlas migrate apply --dir file:///migrations --url "$$DATABASE_URL"'
    environment:
      DATABASE_URL: postgres://leamout:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/leamout?sslmode=disable&search_path=public
    volumes:
      - ../../server/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [control]

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ../../containers/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [control]

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["/leamout/server"]
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      freeswitch:
        condition: service_healthy
    networks: [edge, control]

  backoffice:
    build:
      context: ../../server
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["/leamout/backoffice"]
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [control]

  worker:
    build:
      context: ../../server
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["/leamout/worker"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      freeswitch:
        condition: service_healthy
    volumes:
      - recordings-data:/var/lib/freeswitch/recordings
    networks: [control]

  media:
    build:
      context: ../../server
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["/leamout/media"]
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [control]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/leamout/acme:/srv/leamout-acme:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    networks: [edge, control]

  freeswitch:
    build:
      context: ../../containers/freeswitch
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    depends_on:
      media:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -H 127.0.0.1 -P 8021 -p \"$$FREESWITCH_ESL_PASSWORD\" -x status | grep -q '^UP '"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    volumes:
      - recordings-data:/var/lib/freeswitch/recordings
    networks:
      control:
        ipv4_address: 172.32.0.20

  rtpengine:
    build:
      context: ../../containers/rtpengine
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RTPENGINE_PUBLIC_IP: ${PUBLIC_IP:?PUBLIC_IP is required}
    ports:
      - "23000-32768:23000-32768/udp"
    networks:
      control:
        ipv4_address: 172.32.0.10
      media:
        ipv4_address: 172.31.0.10

  opensips:
    build:
      context: ../../containers/opensips
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OPENSIPS_DATABASE_URL: postgres://leamout:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/leamout
    volumes:
      - /etc/leamout/certs/fullchain.pem:/etc/opensips/tls/fullchain.pem:ro
      - /etc/leamout/certs/privkey.pem:/etc/opensips/tls/privkey.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_started
      freeswitch:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "5062:5062/tcp"
    networks: [control, signaling]

  coturn:
    build:
      context: ../../containers/coturn
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../../server/.env}
    environment:
      TURN_REALM: ${TURN_REALM:?TURN_REALM is required}
      TURN_EXTERNAL_IP: ${PUBLIC_IP:?PUBLIC_IP is required}
      TURN_MIN_PORT: "49152"
      TURN_MAX_PORT: "65535"
    volumes:
      - /etc/leamout/certs/fullchain.pem:/etc/coturn/tls/fullchain.pem:ro
      - /etc/leamout/certs/privkey.pem:/etc/coturn/tls/privkey.pem:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    networks: [media]

volumes:
  keycloak-postgres-data:
  postgres-data:
  redis-data:
  nats-data:
  recordings-data:
  caddy-data:
  caddy-config:

networks:
  control:
    ipam:
      config:
        - subnet: 172.32.0.0/24
  media:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  signaling:
  edge:
