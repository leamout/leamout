[rtpengine]

# RTP/media interface.
# Replace these addresses with the actual addresses used by the
# Linux host/container networking environment.
interface = public/172.20.0.10!203.0.113.10

# Run in the foreground for Docker.
foreground = true
log-stderr = true
log-level = 6

# OpenSIPS NG control protocol.
listen-ng = 0.0.0.0:22222

# HTTP diagnostics.
listen-http = 0.0.0.0:8080

# RTP/RTCP media port range.
port-min = 23000
port-max = 32768

# Do not record media by default.
delete-delay = 0
