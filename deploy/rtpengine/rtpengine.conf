[rtpengine]

# Stable Docker-network address used as RTPengine's local/public media
# interface. RTPENGINE_PUBLIC_IP is the externally reachable address that is
# advertised in SDP.
interface = public/172.30.0.10!@RTPENGINE_PUBLIC_IP@

foreground = true
log-stderr = true
log-level = 6

# OpenSIPS NG control protocol. This remains private to leamout-core.
listen-ng = 0.0.0.0:22222

# Internal diagnostics only; Compose does not publish 8080.
listen-http = 0.0.0.0:8080

# Public RTP/RTCP media range. Must match deploy/compose.yaml exactly.
port-min = 23000
port-max = 32768

delete-delay = 0
