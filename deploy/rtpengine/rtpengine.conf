[rtpengine]

# The container gets a stable address on the leamout-core network.
# RTPengine advertises RTPENGINE_PUBLIC_IP in SDP for external peers.
interface = public/172.30.0.10!@RTPENGINE_PUBLIC_IP@

# Run in the foreground for Docker.
foreground = true
log-stderr = true
log-level = 6

# OpenSIPS NG control protocol.
listen-ng = 0.0.0.0:22222

# HTTP diagnostics. Keep this internal; do not publish 8080.
listen-http = 0.0.0.0:8080

# RTP/RTCP media port range. Keep this aligned with Compose.
port-min = 23000
port-max = 32768

# Do not record media by default.
delete-delay = 0
