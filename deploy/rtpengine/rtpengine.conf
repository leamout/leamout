[rtpengine]

# Internal media remains on the Docker network. External media advertises the
# public RTP address while binding the same stable container interface.
interface = internal/172.30.0.10;external/172.30.0.10!@RTPENGINE_PUBLIC_IP@

foreground = true
log-stderr = true
log-level = 6

# OpenSIPS NG control protocol. This remains private to leamout-core.
listen-ng = 0.0.0.0:22222

# Internal diagnostics only; Compose does not publish 8080.
listen-http = 0.0.0.0:8080

# Public RTP/RTCP media range. Must match deploy/compose.yaml exactly.
port-min = 23000
port-max = 32768

delete-delay = 0
