global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: leamout
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.yml]
        refresh_interval: 30s
