#
# Xtottel / Leamout
# OpenSIPS SIP routing configuration
#
# OpenSIPS 3.4
#

####### Global Parameters #########

log_level = 3
xlog_level = 3
stderror_enabled = yes
syslog_enabled = no

socket = udp:0.0.0.0:5060
socket = tcp:0.0.0.0:5060

####### Modules #########

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "rtpengine.so"

####### Module Parameters #########

# Record-Route support.
modparam("rr", "enable_double_rr", 2)
modparam("rr", "append_fromtag", 1)

# RTPengine NG control interface.
modparam(
    "rtpengine",
    "rtpengine_sock",
    "udp:rtpengine:22222"
)

####### Main Routing #########

route {

    xlog("L_INFO", "Xtottel SIP request: $rm $ru from $fu\n");

    #
    # Basic sanity checks
    #

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    #
    # Handle retransmissions / transactions
    #

    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }

        t_check_trans();
    }

    #
    # CANCEL must follow the existing transaction.
    #

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }

        exit;
    }

    #
    # Keep dialog requests on the established route.
    #

    if (has_totag()) {

        if (loose_route()) {
            route(RELAY);
            exit;
        }

        if (is_method("ACK")) {
            route(RELAY);
            exit;
        }

        sl_send_reply("404", "Not Here");
        exit;
    }

    #
    # Initial INVITE
    #

    if (is_method("INVITE")) {

        #
        # Anchor media through RTPengine.
        #

        if (!rtpengine_offer("replace-origin replace-session-connection")) {
            xlog("L_ERR", "RTPengine offer failed\n");
            sl_send_reply("500", "Media Proxy Error");
            exit;
        }

        record_route();

        #
        # MVP:
        # Forward the request according to the current Request-URI.
        #
        route(RELAY);
        exit;
    }

    #
    # Other initial requests
    #

    route(RELAY);
}

####### Relay Route #########

route[RELAY] {

    if (!t_relay()) {
        sl_reply_error();
    }

    exit;
}
