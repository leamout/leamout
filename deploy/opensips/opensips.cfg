#
# Leamout CPaaS - Core SIP Edge Router
# OpenSIPS 3.4
# Philosophy: fail-closed, fraud-resistant, media-anchored.
#

####### Global Parameters #########
log_level = 3
xlog_level = 3
stderror_enabled = yes
syslog_enabled = no

udp_workers = 4
tcp_workers = 2

socket = udp:0.0.0.0:5060
socket = tcp:0.0.0.0:5060

# If OpenSIPS is behind a NAT/load balancer, set these to the externally
# reachable SIP address. This is SIP signaling, not RTP/SDP addressing.
# advertised_address = <PUBLIC_SIP_IP>
# advertised_port = 5060

####### Modules #########
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "dialog.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "rtpengine.so"
loadmodule "pike.so"
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"

####### Module Parameters #########
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
modparam("rr", "append_fromtag", 1)
modparam("dialog", "detect_spirals", 1)

# Must match deploy/compose.yaml exactly.
modparam("auth_db", "db_url", "postgres://leamout:leamout@postgres:5432/leamout")
modparam("auth_db", "db_table", "subscribers")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "domain_column", "domain")
modparam("auth_db", "password_column", "ha1_md5")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "use_domain", 1)

# Must match deploy/rtpengine/rtpengine.conf.
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:22222")
modparam("rtpengine", "rtpengine_retr", 5)

# Basic CPS protection; tune against measured production traffic.
modparam("pike", "sampling_time_unit", 10)
modparam("pike", "reqs_density_per_unit", 10)
modparam("pike", "remove_latency", 1)

####### Main Routing #########
route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!pike_check_req()) {
        xlog("L_WARN", "PIKE: blocking excessive requests from $si\n");
        sl_send_reply("403", "Forbidden - Rate Limit Exceeded");
        exit;
    }

    if (has_totag()) {
        if (!loose_route()) {
            send_reply("404", "Not Here");
            exit;
        }

        if (!validate_dialog()) {
            xlog("L_WARN", "SECURITY: rejected invalid in-dialog $rm Call-ID $ci from $si\n");
            send_reply("403", "Invalid Dialog");
            exit;
        }

        if (is_method("INVITE|ACK") && has_body("application/sdp")) {
            if (!rtpengine_manage("replace-origin replace-session-connection ICE=force")) {
                xlog("L_ERR", "RTPengine failed for in-dialog $rm Call-ID $ci\n");
                send_reply("500", "Media Relay Error");
                exit;
            }
        }

        if (is_method("BYE|CANCEL")) {
            rtpengine_delete();
        }

        route(RELAY);
        exit;
    }

    t_check_trans();

    if (loose_route()) {
        send_reply("403", "Preload Route Denied");
        exit;
    }

    if (is_method("OPTIONS") && is_myself("$rd") && $rU == NULL) {
        send_reply("200", "OK");
        exit;
    }

    # REGISTER is authenticated against PostgreSQL; locations remain in memory.
    if (is_method("REGISTER")) {
        if (!www_authorize("", "subscribers")) {
            www_challenge("", "auth");
            exit;
        }

        if ($au != $tU) {
            xlog("L_WARN", "SECURITY: SIP identity mismatch on REGISTER from $si\n");
            send_reply("403", "SIP Identity Mismatch");
            exit;
        }

        consume_credentials();

        if (!save("location")) {
            send_reply("500", "Registration Failed");
        }
        exit;
    }

    if (!is_method("INVITE|MESSAGE")) {
        send_reply("405", "Method Not Allowed");
        exit;
    }

    # All new application requests require subscriber authentication.
    if (!proxy_authorize("", "subscribers")) {
        proxy_challenge("", "auth");
        exit;
    }

    if ($au != $fU) {
        xlog("L_WARN", "SECURITY: From URI mismatch. Auth: $au, From: $fU from $si\n");
        send_reply("403", "SIP Identity Mismatch");
        exit;
    }

    consume_credentials();

    if (is_method("INVITE")) {
        if (!create_dialog()) {
            send_reply("500", "Dialog Tracking Failed");
            exit;
        }

        # OpenSIPS owns SIP signaling. RTPengine owns public media addressing.
        if (has_body("application/sdp")) {
            if (!rtpengine_offer("replace-origin replace-session-connection ICE=force")) {
                xlog("L_ERR", "RTPengine offer failed for Call-ID $ci\n");
                send_reply("500", "Media Proxy Error");
                exit;
            }
        }

        # Temporary internal echo/test service. The Go/NATS routing engine will
        # eventually select the destination for provisioned calls.
        if ($rU == "9196") {
            $du = "sip:freeswitch:5060";
            record_route();
            route(RELAY);
            exit;
        }

        # Registered SIP-to-SIP destination.
        if (db_does_uri_exist($ru, "subscribers")) {
            record_route();
            if (!lookup("location", "method-filtering")) {
                send_reply("404", "Not Registered");
                exit;
            }
            route(RELAY);
            exit;
        }

        # Carrier/PSTN egress remains disabled until the routing engine
        # provisions an explicit carrier destination.
        xlog("L_WARN", "ROUTING: external destination $ru blocked by default policy\n");
        send_reply("404", "Destination Not Provisioned or No Carrier Route");
        exit;
    }

    # MESSAGE to a registered subscriber.
    if (db_does_uri_exist($ru, "subscribers")) {
        if (!lookup("location", "method-filtering")) {
            send_reply("404", "Not Registered");
            exit;
        }
        route(RELAY);
        exit;
    }

    send_reply("404", "Not Found");
}

####### Relay Route #########
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

####### Reply / Failure Routes #########
onreply_route[rtpengine_reply] {
    if (has_body("application/sdp")) {
        if (!rtpengine_manage("replace-origin replace-session-connection ICE=force")) {
            xlog("L_ERR", "RTPengine failed to process SDP reply for Call-ID $ci\n");
        }
    }

    if (t_check_status("[3-6][0-9][0-9]")) {
        rtpengine_delete();
    }
}

failure_route[rtpengine_failure] {
    rtpengine_delete();
}
