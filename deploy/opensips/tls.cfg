#
# Xtottel / Leamout
# OpenSIPS 4.0 TLS configuration
#
# Certificate paths inside the OpenSIPS container:
#
#   /etc/opensips/tls/fullchain.pem
#   /etc/opensips/tls/privkey.pem
#
# Do not commit private keys to this repository.
#

# Default inbound TLS server domain.
modparam("tls_mgm", "server_domain", "leamout")

modparam("tls_mgm", "match_ip_address", "[leamout]*")

modparam(
    "tls_mgm",
    "certificate",
    "[leamout]/etc/opensips/tls/fullchain.pem"
)

modparam(
    "tls_mgm",
    "private_key",
    "[leamout]/etc/opensips/tls/privkey.pem"
)

# Modern TLS.
modparam(
    "tls_mgm",
    "tls_method",
    "[leamout]TLSv1_2-TLSv1_3"
)

# Application/SIP authentication is used for now.
# Mutual TLS can be enabled later for trusted carrier connections.
modparam("tls_mgm", "verify_cert", "[leamout]0")
modparam("tls_mgm", "require_cert", "[leamout]0")
