# ─────────────────────────────────────────────────────────────
# Leamout TURN server
# ─────────────────────────────────────────────────────────────

# TURN listener
listening-port=3478

# TLS listener
tls-listening-port=5349

# Bind to all container interfaces.
listening-ip=0.0.0.0

# Relay address.
#
# For local Docker development, leave this unset.
# For production behind NAT, configure:
#
# external-ip=PUBLIC_IP/PRIVATE_IP
#
# Example:
# external-ip=203.0.113.50/10.0.0.10


# Relay port range.
min-port=49152
max-port=65535


# Authentication
#
# Long-term credential mechanism.
lt-cred-mech=true

# Realm used for TURN authentication.
realm=turn.xtottel.local


# Security
#
# Don't allow the server to be used as a general-purpose proxy.
no-cli
no-loopback-peers
no-multicast-peers


# Logging
simple-log
log-file=stdout


# Don't daemonize inside Docker.
no-stdout-log=false
