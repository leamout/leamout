services:
  api:
    environment:
      SSL_CERT_FILE: /voice-v1-certs/ca.crt
    volumes:
      - ${VOICE_V1_CERT_DIR:?VOICE_V1_CERT_DIR is required}/ca.crt:/voice-v1-certs/ca.crt:ro

  worker:
    environment:
      SSL_CERT_FILE: /voice-v1-certs/ca.crt
    volumes:
      - ${VOICE_V1_CERT_DIR:?VOICE_V1_CERT_DIR is required}/ca.crt:/voice-v1-certs/ca.crt:ro

  voice-v1-carrier:
    image: leamout/voice-v1-carrier:dev
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
    volumes:
      - ${VOICE_V1_SUITE_DIR:?VOICE_V1_SUITE_DIR is required}/carrier-dialplan.xml:/leamout-config/dialplan/leamout.xml:ro
    expose:
      - "5060/udp"
      - "5060/tcp"
      - "8021/tcp"
    networks:
      leamout-core:
        ipv4_address: 172.30.0.50

  voice-v1-webhook:
    image: python:3.13-alpine
    restart: unless-stopped
    command:
      - python
      - /app/webhook_receiver.py
      - --cert
      - /certs/webhook.crt
      - --key
      - /certs/webhook.key
      - --port
      - "8443"
    volumes:
      - ${VOICE_V1_SUITE_DIR:?VOICE_V1_SUITE_DIR is required}/webhook_receiver.py:/app/webhook_receiver.py:ro
      - ${VOICE_V1_CERT_DIR:?VOICE_V1_CERT_DIR is required}/webhook.crt:/certs/webhook.crt:ro
      - ${VOICE_V1_CERT_DIR:?VOICE_V1_CERT_DIR is required}/webhook.key:/certs/webhook.key:ro
    ports:
      - "18443:8443"
    networks:
      - leamout-core
