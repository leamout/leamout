services:
  self-hosted-opensips:
    image: leamout/opensips:4.0.1
    build:
      context: ../../containers/opensips
      dockerfile: Dockerfile
      args:
        OPENSIPS_VERSION: 4.0.1
        DISTRIBUTION: self-hosted
    restart: unless-stopped
    environment:
      OPENSIPS_DATABASE_PASSWORD: leamout
      OPENSIPS_ADVERTISED_ADDRESS: self-hosted-opensips
    ports:
      - "5070:5060/udp"
    volumes:
      - ${SELF_HOSTED_LEAMOUT_CARRIER_CERT_DIR:?required}/fullchain.pem:/etc/opensips/tls/fullchain.pem:ro
      - ${SELF_HOSTED_LEAMOUT_CARRIER_CERT_DIR:?required}/privkey.pem:/etc/opensips/tls/privkey.pem:ro
      - ${SELF_HOSTED_LEAMOUT_CARRIER_CERT_DIR:?required}/carrier-ca.pem:/etc/opensips/tls/carrier-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_started
      freeswitch:
        condition: service_started
    networks:
      private-control: {}
      public-signaling:
        ipv4_address: 172.30.0.11

  rtpengine:
    ports: !reset []
