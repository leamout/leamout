services:
  opensips:
    environment:
      OPENSIPS_ADVERTISED_ADDRESS: sip.leamout.com
    volumes:
      - ${MANAGED_SIP_EDGE_CERT_DIR:?required}/fullchain.pem:/etc/opensips/tls/fullchain.pem:ro
      - ${MANAGED_SIP_EDGE_CERT_DIR:?required}/privkey.pem:/etc/opensips/tls/privkey.pem:ro
      - ${MANAGED_SIP_EDGE_CERT_DIR:?required}/carrier-ca.pem:/etc/opensips/tls/carrier-ca.pem:ro

  rtpengine:
    ports: !reset []

  managed-sip-edge-wholesale:
    image: python:3.13-alpine
    command: ["python3", "/suite/wholesale.py"]
    restart: unless-stopped
    volumes:
      - ${MANAGED_SIP_EDGE_SUITE_DIR:?required}:/suite:ro
    ports:
      - "18088:8088"
    networks:
      - public-signaling

